name: Synthetic tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned requirements
        run: python -m pip install --require-hashes -r scripts/requirements.txt
      - name: Lint
        run: |
          python -m pip install --require-hashes -r scripts/requirements-lint.txt
          ruff check scripts tests
      - name: Check syntax
        run: python -m compileall -q scripts tests
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -v
