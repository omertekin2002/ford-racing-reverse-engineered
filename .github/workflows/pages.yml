name: Browser preview and GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - web/**
      - engine/**
      - game/**
      - scripts/**
      - analysis/**
      - .github/workflows/pages.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages (pushes to main always deploy)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: browser-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build native TypeScript + WebGL2 engine
        run: |
          npm --prefix engine ci
          npm --prefix engine run typecheck
          npm --prefix engine run build
          npm --prefix engine test
      - name: Verify in-repo Ford Racing 3 Shuffle game files
        run: python3 scripts/acquire_demo.py game
      - name: Build the static Native WebGL2 site
        run: python3 scripts/build_web.py --game game --output artifacts/web
      - name: Verify packaged assets and project-page paths
        run: python3 scripts/verify_web.py artifacts/web
      - name: Upload downloadable browser build
        uses: actions/upload-artifact@v4
        with:
          name: ford-racing-3-shuffle-webgl2
          path: artifacts/web
          include-hidden-files: true
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/web

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy static game
        id: deployment
        uses: actions/deploy-pages@v4
