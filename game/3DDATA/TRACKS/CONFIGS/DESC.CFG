//	Valid settings:
//	"FOG: <density> <red> <green> <blue>"
//		density = float value for how dense. Values between 0.0 and 1.0
//    red, green, blue = fog colour. Values between 0 and 255 for each.
//
//	"CAR_HEADLIGHT_STRENGTH: <strength>"
//		strength = float value for strength of car headlight effect - between 0.0 and 1.0
//
// "TRACK_WETNESS: <wet value>"
// 	wet value = float value for wetness of the track, between 0.0 (dry) and 1.0 (wet)
//
// "SUN_FLARE_SIZE: <size>"
// 	size = size of sun flare, expressed as a proportion of screen size (at 1.0 the flare would be the same width as the screen) 
//

FOG: 0.36 41 66 123
CAR_HEADLIGHT_STRENGTH: 0.50
TRACK_WETNESS: 0.0
SUN_FLARE_SIZE: 0.62
HEAT_HAZE_STRENGTH: 0.77