; FR3AddOns settings for the Ford Racing 3 Shuffle mod: replaces FR3Antialiasing, FR3BorderlessWindowed,
; FR3WidescreenFix, FR3ClassExtender, FR3Freecam, FR3LodPatch, FR3CrashSoundFix and
; FR3ExpandedProfileName (delete those .asi / .ini files). The ClassExtender's rule changes are
; in [Rules] (VintageAllModes, DuelAllCars, OffroadSkills = 1 to keep them).

; FR3AddOns.ini - settings of FR3AddOns.asi (Ford Racing 3, PC). Keep it next to the .asi.
; Comments must sit on their own lines.

[Display]
; borderless | windowed | fullscreen | game (game = leave the window and resolution alone)
WindowMode=borderless
; render resolution; 0 = the monitor's size
Width=0
Height=0
; 1 = wait for the screen refresh (no tearing), 0 = off
VSync=1
; refresh rate in Hz: fullscreen switches the screen to it (0 = the highest it offers at that size);
; in every mode the frame rate stays at or below it
RefreshRate=0
; highest frame rate in fps, in every mode; 0 = the refresh rate. At any frame rate the race runs
; exactly as at the game's own cap of 122 fps (same game speed, physics, AI, sound); the frames in
; between show the cars and cameras between their last two positions. -1 = the game's own race
; timing (it drives differently at other frame rates)
FrameCap=0
; anisotropic filtering 2..16, 0 = off
Anisotropy=16
; multisample antialiasing 2, 4 or 8; 0 = off
MSAA=0
; race camera field of view multiplier, 0.5..2.0 (1.0 = the game's)
FOV=1.0
; 1 = correct 3D on screens wider than 4:3 (wider view, nothing stretched)
Widescreen=1
; an exe that already carries a widescreen hex patch (AuToMaNiAk005's, e.g. Ford Racing 3 Shuffle's):
; 1 = take it out in memory and use the settings here; 0 = keep it (Widescreen above is then off)
UndoExeWidescreen=1
; on screens wider than 4:3 (needs Widescreen=1):
;   Menus       pillarbox | stretch
;   HUD         anchored (to the screen edges) | centered | stretch
;   Backgrounds full-screen pictures and movies: pillarbox | crop | stretch
Menus=pillarbox
HUD=centered
Backgrounds=stretch
; windowed / borderless: the Windows mouse cursor drives the menus and is not captured
FreeMouse=1
DPIAware=1

[Input]
; Xbox-style (XInput) pads appear as "XInput Controller 1..4" in Options -> Controls: RT accelerate,
; LT brake (both at once allowed), A handbrake, B boost, X look back, Y camera, LB/RB gears,
; Start pause; rumble; plug in any time. Pick it once in Options -> Controls -> Player One.
XInput=1
; accelerate and brake on the two triggers instead of one combined axis
SplitPedals=1
Rumble=1
; 0..2
RumbleStrength=1.0
; until a profile drives with the pad, pad 1 works the menus as Enter / Esc / arrows
PadInMenus=1
; radial stick dead zone of the pad, and the game's own steering dead zone (retail 0.10)
StickDeadZone=0.05
SteeringDeadZone=0.02
TriggerDeadZone=0.05
; windowed / borderless: losing focus pauses the race (fullscreen already does)
PauseOnFocusLoss=1

[Graphics]
; these replace the registry settings of CONFIG\syscfg.exe (delete a line to use the registry
; value again; with no registry key the game turns all five effects off)
DynamicShadows=1
EnvironmentMapping=1
DepthOfField=1
HeatHaze=1
SpecularBloom=1
; 0..2 (2 = highest)
ModelDetail=2
VisualRange=2
; model detail: LodDistance scales the distances where models switch to simpler versions
; (2.0 = twice as far); ModelLod=0 always draws the most detailed one (-1 = the game picks)
LodDistance=2.0
ModelLod=0

[Limits]
; brand-new display names (TXT_...) in add-on data, text from LANGUAGE\ADDON.DAT
TextEnums=1
; room for 1024 menu pictures instead of 240
Graphics=1
; the unused ARENA track location becomes "Custom Tracks", open to every car class
CustomTracks=1
CustomTracksName=TOTAL IMMERSION RACING
; more than 6 tracks per location / 16 cars per class, in pages (tracks: LEFT/RIGHT past the row
; end; cars: UP/DOWN past the grid, PgUp/PgDn, [ ], mouse wheel; CarPages=0 shows the first 16)
TrackPages=1
CarPages=1
; tracks with more textures than retail ever used (over 256 render states / 64 per texture list,
; e.g. converted Gran Turismo 3 courses)
TrackTextures=1
; typed profile names of up to this many characters (1-31) where UI\KEYBD.UI has a text box
; PROFILE_NAME_TEXTBOX (otherwise the original 3 initials); 0 = off
ProfileName=12

[FR2Tracks]
; tracks ported from Ford Racing 2 (tools/fr2_to_fr3.py marks them with FR2PORT.TXT in their
; 3DDATA\TRACKS folder): FR2's start grid (15 m between slots, the first 20 m behind the line)
Grid=1

[Classes]
; extra car classes for CARDATA :CAR_GROUP_TYPE (and :TIME_CAR_GROUP_TYPE): ClassN=NAME,STOCK[,SAMPLE]
; N = 6 or 7 (in order). STOCK = CLASSIC, MODERN, OFFROAD, PERFORMANCE or VINTAGE: the class whose
; track locations, AI tuning, time targets and difficulty the new class uses. Menu label:
; TXT_CAR_THEME_<NAME> in LANGUAGE\ADDON.DAT or TLATE_xx.DAT. SAMPLE: an announcer sample index
; (default: STOCK's line). UI\CAR.UI needs one BUTTONk per class that has cars.
; OwnRecords=1: each extra class has its own track records (the save layout changes: saves
; made with other classes do not load); 0: records shared with STOCK
OwnRecords=1
Class6=HIGH_PERFORMANCE,PERFORMANCE,55
Class7=RALLY,OFFROAD,56

[Rules]
; changes to the game's own rules (they apply to every track and car; 0 = original)
; VINTAGE cars in every mode (originally not in Overtake, Duel, Drafting, Relay, Driving Skills,
; Seconds Out and Time Attack)
VintageAllModes=0
; every car available in Duel
DuelAllCars=0
; Alaska and Pacific tracks in Driving Skills and Seconds Out (they need GATE\MAIN and BONUS files)
OffroadSkills=0

[Audio]
; sounds playing at once (the original 16 leaves crash sounds silent behind engine and tyre noise)
Voices=64
; a sound started again plays from its start (crash sounds could stay silent)
RestartRewind=1
; voices the game sets below this pitch (Hz) play at their own pitch instead (scrapes and similar
; sounds otherwise drop to inaudible rates on current Windows); 0 = off
PitchFloor=1000
; reverb on the player's car in the track's tunnel and underpass zones (SOUND\<group>\<track>\REVERB.DAT);
; the original PC game never turned it on. Mix: reverb level in dB (-30..-1), Time: reverb time in ms
TunnelReverb=1
TunnelReverbMix=-8
TunnelReverbTime=1500
; the announcer through DirectSound instead of DirectMusic: auto (Wine/Proton, where DirectMusic
; stays silent), on, off
SpeechFallback=auto

[Freecam]
; a free camera in races (keys read from the game's keyboard): ToggleKey on/off, W/S/A/D move,
; Q up, E or Ctrl down, Shift faster, Alt slower, mouse to look, ResetKey back to the game camera,
; FovUpKey/FovDownKey, RollLeftKey/RollRightKey/RollResetKey, HudKey hides the HUD, PauseKey
; freezes the race (and turns the camera on when PauseTurnsOn=1). Key names: F1-F24, A-Z, 0-9,
; SHIFT CTRL ALT SPACE TAB PAGEUP PAGEDOWN HOME END INSERT DELETE PAUSE BACKSPACE, or a number
Enabled=1
ToggleKey=F10
ResetKey=F11
HudKey=F9
PauseKey=F7
PauseTurnsOn=1
FovUpKey=PAGEUP
FovDownKey=PAGEDOWN
RollLeftKey=Z
RollRightKey=C
RollResetKey=X
; m/s
MoveSpeed=28
SprintSpeed=95
SlowSpeed=7
; radians per pixel
MouseSensitivity=0.002
InvertMouseY=0
MaxPitch=88
RollSpeed=90
; horizontal degrees
FOV=90
FovStep=10
; 1 = W/S stay level
LevelMovement=0
; while the camera is on: draw distance in metres and the scenery radius multiplier
FarClip=30000
ViewRangeScale=4
